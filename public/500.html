<!doctype html>
<html lang="en">

  <head>

    <title>Something went wrong (500) | Second Breakfast</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">

    <style>

      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      html { font-size: 16px; }

      body {
        background: #ffffff;
        color: #111827;
        display: grid;
        font-family: "Inter var", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        min-height: 100vh;
        place-items: center;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      main {
        display: grid;
        gap: 1.5rem;
        justify-items: center;
        max-width: 34rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }

      .plate { color: #4338ca; height: 4rem; width: 4rem; }

      .code {
        color: #4b5563;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p { color: #374151; }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }

      a.button {
        align-items: center;
        background: #4f46e5;
        border-radius: 0.375rem;
        color: #ffffff;
        display: inline-flex;
        font-size: 0.875rem;
        font-weight: 600;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        text-decoration: none;
      }

      a.button:hover { background: #4338ca; }

      a.button.secondary {
        background: #f3f4f6;
        color: #1f2937;
      }

      a.button.secondary:hover { background: #e5e7eb; }

      a:focus-visible, a.button:focus-visible {
        outline: 2px solid #4338ca;
        outline-offset: 2px;
      }

      footer {
        color: #4b5563;
        font-size: 0.8125rem;
      }

      footer a { color: #1f2937; }

    </style>

  </head>

  <body>

    <!-- This file lives in public/500.html -->

    <main>
      <svg class="plate" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <circle cx="12" cy="12" r="5" />
      </svg>

      <div>
        <p class="code">Error 500</p>
        <h1>Something boiled over</h1>
      </div>

      <p>An error crept in at our end and the page could not be served. It has been logged &mdash; please try again in a moment.</p>

      <nav>
        <a class="button" href="/">Back to the kitchen</a>
        <a class="button secondary" href="/recipes">Browse recipes</a>
      </nav>

      <footer>
        <p>Second Breakfast &mdash; built by <a href="https://swm.cc">swmcc</a>.</p>
      </footer>
    </main>

  </body>

</html>
