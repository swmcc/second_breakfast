---
openapi: 3.0.1
info:
  title: Second Breakfast API
  version: v1
  description: |-
    API for managing recipes, categories, and meal baskets.

    ## Authentication

    **All endpoints require authentication** via a Bearer API key.

    Create a key on the [Account page](/account) (API Keys section): give it a
    name, click **Create key**, and copy the `sb_...` token — it is shown
    exactly once and cannot be retrieved again. Keys can be revoked from the
    same page at any time.

    Click the **Authorize** button above and enter your key (without "Bearer" prefix).
paths:
  "/api/v1/baskets":
    get:
      summary: List basket items
      tags:
      - Baskets
      security:
      - bearer_auth: []
      responses:
        '200':
          description: basket items found
          content:
            application/json:
              schema:
                type: object
                properties:
                  baskets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        recipe:
                          "$ref": "#/components/schemas/Recipe"
                        added_at:
                          type: string
                          format: date-time
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Add recipe to basket
      tags:
      - Baskets
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: recipe added to basket
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  basket_id:
                    type: integer
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                basket:
                  type: object
                  properties:
                    recipe_id:
                      type: integer
                  required:
                  - recipe_id
  "/api/v1/baskets/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Remove recipe from basket
      tags:
      - Baskets
      security:
      - bearer_auth: []
      responses:
        '204':
          description: recipe removed from basket
        '401':
          description: unauthorized
        '404':
          description: basket item not found
  "/api/v1/categories":
    get:
      summary: List categories
      tags:
      - Categories
      security:
      - bearer_auth: []
      responses:
        '200':
          description: categories found
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Category"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/categories/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show a category with recipes
      tags:
      - Categories
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: category found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  recipes:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Recipe"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '404':
          description: category not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/recipes":
    get:
      summary: List recipes
      tags:
      - Recipes
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Items per page
        schema:
          type: integer
      responses:
        '200':
          description: recipes found
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Recipe"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Create a recipe
      tags:
      - Recipes
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: recipe created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Recipe"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                recipe:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    serves:
                      type: integer
                    prep_time:
                      type: string
                    category_id:
                      type: integer
                    instructions:
                      type: string
                    ingredients:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          quantity:
                            type: number
                          unit:
                            type: string
                    nutrition:
                      type: object
                  required:
                  - title
                  - description
                  - serves
                  - prep_time
                  - category_id
                  - instructions
                  - ingredients
                  - nutrition
  "/api/v1/recipes/search":
    get:
      summary: Search recipes
      tags:
      - Recipes
      security:
      - bearer_auth: []
      parameters:
      - name: query
        in: query
        required: true
        description: Search query
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: SQL metacharacters are treated literally
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Recipe"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/recipes/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show a recipe
      tags:
      - Recipes
      security:
      - bearer_auth: []
      responses:
        '200':
          description: recipe found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Recipe"
        '404':
          description: recipe not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    put:
      summary: Update a recipe
      tags:
      - Recipes
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: recipe updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Recipe"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                recipe:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
    delete:
      summary: Delete a recipe
      tags:
      - Recipes
      security:
      - bearer_auth: []
      responses:
        '204':
          description: recipe deleted
        '401':
          description: unauthorized
servers:
- url: "{protocol}://{host}"
  variables:
    protocol:
      default: http
      enum:
      - http
      - https
    host:
      default: localhost:3000
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: API token authentication
  schemas:
    Recipe:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        serves:
          type: integer
        prep_time:
          type: string
        ingredients:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              quantity:
                type: string
              unit:
                type: string
        nutrition:
          type: object
          properties:
            calories:
              type: string
            protein:
              type: string
            fat:
              type: string
            carbs:
              type: string
            fibre:
              type: string
            sugar:
              type: string
            sodium:
              type: string
        instructions:
          type: string
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        per_page:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string
    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
