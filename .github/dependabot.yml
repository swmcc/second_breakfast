version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️"

  - package-ecosystem: npm
    directory: "/mcp-server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️"
